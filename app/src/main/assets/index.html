(()=>{'use strict';
const KEY='openboard.v1';const COLORS=['#ffffff','#f3df9f','#cce5d0','#e2d5ee','#d1e5f1','#f3d3cd'];const $=s=>document.querySelector(s);const id=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starter=()=>({boards:[{id:id(),title:'Welcome to Openboard',updated:Date.now(),cards:[{id:id(),title:'Welcome ✨',body:'Your ideas belong here. Double-tap a note to edit it. Long-press and drag to move it.',color:'#f3df9f',x:80,y:70},{id:id(),title:'Getting started',body:'＋ adds cards. Pinch to zoom; swipe empty space to move around. Your work saves on this device.',color:'#cce5d0',x:350,y:110},{id:id(),title:'Explore and organize',body:'Connections, nested boards, and auto-layout are ready. PDF reconstruction, research tools, and AI review are planned.',color:'#e2d5ee',x:195,y:300}]}],tabs:[],active:null,views:{}});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||starter();if(!Array.isArray(state.boards))throw 0}catch{state=starter()}state.tabs=Array.isArray(state.tabs)?state.tabs:[];state.views=state.views||{};let screen='library',search='',selection=null,connectFrom=null,menu=false,history=[],future=[],touch=null,renderQueued=false;
// IndexedDB holds complete workspaces (including imported image data); localStorage is a legacy fallback.
let database=null, databaseReady=false,saveSequence=0,saveDelay=null,storageWarning=false;
function dbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(Error('IndexedDB unavailable'));const q=indexedDB.open('openboard-workspace',1);q.onupgradeneeded=()=>q.result.createObjectStore('documents');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function dbGet(){return new Promise((resolve,reject)=>{const t=database.transaction('documents','readonly'),q=t.objectStore('documents').get('main');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function dbPut(payload){return new Promise((resolve,reject)=>{const t=database.transaction('documents','readwrite');t.objectStore('documents').put(payload,'main');t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function warnStorage(){if(!storageWarning){storageWarning=true;alert('Storage may be full or unavailable. Export a JSON backup now to protect your boards.')}}
function save(){const payload=JSON.stringify(state);if(!databaseReady){try{localStorage.setItem(KEY,payload)}catch(e){warnStorage()}return}const seq=++saveSequence;clearTimeout(saveDelay);saveDelay=setTimeout(async()=>{try{await dbPut({state:payload,savedAt:Date.now()});if(seq===saveSequence){try{localStorage.removeItem(KEY)}catch(e){}}}catch(e){console.error('IndexedDB save failed',e);warnStorage()}},220)}
async function initDatabase(){try{database=await dbOpen();const saved=await dbGet();if(saved?.state){const parsed=JSON.parse(saved.state);if(Array.isArray(parsed.boards)){state=parsed;state.tabs=state.tabs||[];state.views=state.views||{};if(state.active&&state.boards.some(b=>b.id===state.active))screen='board';}}databaseReady=true;save();render()}catch(e){console.warn('Using localStorage fallback',e);databaseReady=false;render()}}
function snapshot(){history.push(JSON.stringify(state));if(history.length>40)history.shift();future=[]}function mutate(fn){snapshot();fn();save();render()}function activeBoard(){return state.boards.find(b=>b.id===state.active)}function view(){return state.views[state.active]||(state.views[state.active]={x:0,y:0,scale:1})}function ensureTab(bid){connectFrom=null;if(!state.tabs.includes(bid))state.tabs.push(bid);state.active=bid;screen='board';selection=null;save();render()}function restore(json){const p=JSON.parse(json);if(!Array.isArray(p.boards))throw Error('Invalid board file');state=p;state.tabs=state.tabs||[];state.views=state.views||{};state.active=null;screen='library';save();render()}
function showLibrary(){screen='library';selection=null;connectFrom=null;menu=false;render()}function render(){const b=activeBoard();$('#undo').disabled=!history.length;$('#redo').disabled=!future.length;const tabs=$('#tabs');tabs.hidden=screen==='library';tabs.innerHTML='';if(screen==='library'){renderLibrary();return}if(!b){screen='library';render();return}tabs.innerHTML=state.tabs.map(t=>{const x=state.boards.find(z=>z.id===t);return x?`<div class="tab ${t===state.active?'active':''}" data-tab="${esc(t)}"><span class="tabName">${esc(x.title)}</span><button class="closeTab" aria-label="Close ${esc(x.title)}" data-close="${esc(t)}">×</button></div>`:''}).join('')+'<button class="tabAdd" id="pickBoard" title="Open board">＋</button>';
const main=$('#main');main.innerHTML=`<div class="canvasShell" id="canvas"><div class="world" id="world"><svg id="wires" class="wires" aria-hidden="true"></svg><div id="cardLayer"></div></div><div class="hint">${connectFrom?'Tap a second card to connect · Esc to cancel':'Swipe blank space to pan · Pinch to zoom · Hold a card to move'}</div><div class="tools"><div class="toolPill"><button class="round small" id="zoomOut" aria-label="Zoom out">−</button><span class="zoomTxt" id="zoomText"></span><button class="round small" id="zoomIn" aria-label="Zoom in">+</button></div><div class="toolPill"><button class="round small" id="center" title="Reset view">⌖</button><button class="round small" id="autoLayout" title="Auto-arrange connected cards">♧</button><button class="round small" id="proposal" title="Review proposed board edits">✧</button><button class="round small" id="editBoard" title="Board settings">⚙</button></div><button class="addBtn" id="add" aria-label="Add note">+</button></div>${menu?`<div class="floatMenu"><button class="menuItem" id="addText">▤ &nbsp; Text card</button><button class="menuItem" id="addTask">☑ &nbsp; Checklist card</button><button class="menuItem" id="addLink">↗ &nbsp; Link card</button><button class="menuItem" id="addNested">▣ &nbsp; Nested board</button><button class="menuItem" id="addPDF">▣ &nbsp; Import PDF as board</button></div>`:''}</div>`;drawCards();updateTransform();$('#proposal').onclick=openProposal;
}
function renderLibrary(){const q=search.toLowerCase();$('#main').innerHTML=`<section class="library"><div class="libraryHead"><h1>Your boards</h1><button id="pdfImport" class="outline">▣ Import PDF</button><button id="import" class="outline">↥ Import backup</button><button id="newBoard" class="primary">＋ New board</button><input class="search" id="search" placeholder="Search boards…" value="${esc(search)}" aria-label="Search boards"></div><div class="boardGrid">${state.boards.filter(b=>b.title.toLowerCase().includes(q)).map(b=>`<button class="boardTile" data-board="${esc(b.id)}"><div class="thumb">${b.cards.slice(0,3).map(c=>`<div class="mockcard" style="background:${COLORS.includes(c.color)?c.color:'#fff'}">${esc(c.title||c.body.slice(0,45))}</div>`).join('')||'<span style="color:#8c877e">Empty canvas</span>'}</div><div class="tilemeta"><div style="flex:1;min-width:0"><div class="tiletitle">${esc(b.title)}</div><div class="tileSub">${b.cards.length} cards</div></div><span data-boardmenu="${esc(b.id)}" aria-label="Board options" style="font-size:22px;padding:4px">⋯</span></div></button>`).join('')}</div></section>`}
function cardBody(c){if(c.kind==='image'){return `<div class="noteBody">${c.imageData?`<img class="importedImage" src="${esc(c.imageData)}" alt="${esc(c.title||'PDF image')}" loading="lazy">`:'Image unavailable'}</div>${c.source?`<div class="noteFooter">▣ ${esc(c.source.file)} · page ${Number(c.source.page)||1}</div>`:''}`;}if(c.kind==='link'){const url=String(c.url||'');return `<div class="noteBody">${esc(c.body||'Web reference')}</div>${/^https?:\/\//i.test(url)?`<a class="cardAction" href="${esc(url)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">↗ Open link</a>`:''}`;}if(c.kind==='nested'){const b=state.boards.find(b=>b.id===c.boardId);return `<div class="noteBody">${esc(c.body||'Open the linked board')}</div><button class="cardAction" data-open-nested="${esc(c.boardId||'')}">▣ Open ${esc(b?.title||'board')}</button>`;}return `<div class="noteBody">${esc(c.body||'Tap twice to edit')}</div>${c.source?.type==='pdf-text'?`<div class="noteFooter">▣ ${esc(c.source.file)} · page ${Number(c.source.page)||1}</div>`:''}`}
function drawCards(){const b=activeBoard();if(!b)return;$('#cardLayer').innerHTML=b.cards.map(c=>`<div class="note ${selection===c.id?'selected':''} ${connectFrom===c.id?'sourceCard':''}" data-card="${esc(c.id)}" style="left:${Number(c.x)||0}px;top:${Number(c.y)||0}px;background:${COLORS.includes(c.color)?c.color:'#fff'};width:${Math.min(500,Math.max(150,Number(c.width)||220))}px"><div class="noteHead"><span class="noteTitle">${esc(c.title||'Untitled')}</span><button class="noteMenu" data-cardmenu="${esc(c.id)}" aria-label="Edit card">⋯</button></div>${cardBody(c)}</div>`).join('');drawWires()}
function drawWires(){const b=activeBoard(),svg=$('#wires');if(!b||!svg)return;const cs=new Map(b.cards.map(c=>[c.id,c]));svg.innerHTML=(b.connections||[]).map(edge=>{const a=cs.get(edge.from),z=cs.get(edge.to);if(!a||!z)return '';const na=[...document.querySelectorAll('#cardLayer .note')].find(n=>n.dataset.card===a.id),nb=[...document.querySelectorAll('#cardLayer .note')].find(n=>n.dataset.card===z.id);const aw=na?.offsetWidth||220,bw=nb?.offsetWidth||220,ah=na?.offsetHeight||100,bh=nb?.offsetHeight||100;const ax=a.x+aw/2,ay=a.y+ah/2,bx=z.x+bw/2,by=z.y+bh/2;const horizontal=Math.abs(bx-ax)>Math.abs(by-ay);const x1=ax+(horizontal?(bx>ax?aw/2:-aw/2):0),y1=ay+(horizontal?0:(by>ay?ah/2:-ah/2));const x2=bx+(horizontal?(ax>bx?bw/2:-bw/2):0),y2=by+(horizontal?0:(ay>by?bh/2:-bh/2));const d=horizontal?`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`:`M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}`;return `<path d="${d}"/><circle cx="${x2}" cy="${y2}" r="3.5"/>`}).join('')}
function startConnection(cid){closeModal();connectFrom=cid;selection=cid;render()}
function connectCards(from,to){if(!from||from===to)return;const b=activeBoard();b.connections ||= [];if(b.connections.some(e=>(e.from===from&&e.to===to)||(e.from===to&&e.to===from))){connectFrom=null;render();return}mutate(()=>{b.connections.push({id:id(),from,to});b.updated=Date.now()});connectFrom=null;render()}
function autoLayout(){const b=activeBoard();if(!b||!b.cards.length)return;mutate(()=>{const edges=b.connections||[],visited=new Set();const adj=new Map(b.cards.map(c=>[c.id,[]]));edges.forEach(e=>{adj.get(e.from)?.push(e.to);adj.get(e.to)?.push(e.from)});const roots=[...b.cards].sort((a,z)=>(adj.get(z.id)?.length||0)-(adj.get(a.id)?.length||0));let yStart=30;for(const root of roots){if(visited.has(root.id))continue;let queue=[{id:root.id,depth:0}],layers=[];visited.add(root.id);while(queue.length){const {id:cur,depth}=queue.shift();(layers[depth]||= []).push(cur);for(const next of adj.get(cur)||[])if(!visited.has(next)){visited.add(next);queue.push({id:next,depth:depth+1})}}const height=Math.max(1,...layers.map(l=>l.length))*165;layers.forEach((ids,d)=>ids.forEach((cid,i)=>{const c=b.cards.find(x=>x.id===cid);c.x=50+d*300;c.y=yStart+i*165+(height-ids.length*165)/2}));yStart+=height+90}b.updated=Date.now()});center()}
function updateTransform(){const v=view();const w=$('#world');if(w)w.style.transform=`translate(${v.x}px, ${v.y}px) scale(${v.scale})`;const z=$('#zoomText');if(z)z.textContent=Math.round(v.scale*100)+'%'}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function zoomAt(factor,cx,cy){const v=view();const next=clamp(v.scale*factor,.25,3);const s=next/v.scale;v.x=cx-(cx-v.x)*s;v.y=cy-(cy-v.y)*s;v.scale=next;updateTransform();save()}function center(){const v=view();v.x=32;v.y=35;v.scale=1;updateTransform();save()}
function modal(title,inner,actions){$('#modalRoot').innerHTML=`<div class="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2>${inner}<div class="actions">${actions}</div></div></div>`;$('#modalRoot .modalBackdrop').addEventListener('click',e=>{if(e.target.classList.contains('modalBackdrop'))closeModal()})}function closeModal(){$('#modalRoot').innerHTML=''}
function createBoard(){modal('New board','<label>Board name<input id="boardTitle" class="field" placeholder="Untitled board" maxlength="100"></label>','<button class="outline" id="cancel">Cancel</button><button class="primary" id="confirm">Create board</button>');$('#cancel').onclick=closeModal;$('#confirm').onclick=()=>{const title=$('#boardTitle').value.trim()||'Untitled board';let bid;mutate(()=>{bid=id();state.boards.push({id:bid,title,updated:Date.now(),cards:[]})});closeModal();ensureTab(bid)};$('#boardTitle').focus()}

function editCard(cid){const b=activeBoard(),c=b?.cards.find(c=>c.id===cid);if(!c)return;selection=cid;drawCards();modal('Edit card',`<label>Title<input id="cardTitle" class="field" maxlength="150" value="${esc(c.title)}"></label><label>Notes<textarea id="cardBody" class="field" placeholder="Write anything…">${esc(c.body)}</textarea></label>${c.kind==='link'?`<label>Web address<input id="cardUrl" class="field" placeholder="https://example.com" value="${esc(c.url||'')}"></label>`:''}<label>Card color</label><div class="colors">${COLORS.map(col=>`<button class="swatch ${col===c.color?'active':''}" style="background:${col}" data-color="${col}" aria-label="Select color"></button>`).join('')}</div>`,'<button class="outline" id="connectCard">↗ Connect</button><button class="outline" id="removeConnections">Unlink</button><button class="outline" id="deleteCard" style="color:#aa3939">Delete</button><button class="outline" id="cancel">Cancel</button><button class="primary" id="confirm">Save</button>');let color=c.color;$('#modalRoot').addEventListener('click',e=>{const s=e.target.closest('[data-color]');if(s){color=s.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===s))}},{once:false});$('#connectCard').onclick=()=>startConnection(cid);$('#removeConnections').onclick=()=>{mutate(()=>{b.connections=(b.connections||[]).filter(e=>e.from!==cid&&e.to!==cid)});closeModal()};$('#cancel').onclick=()=>{closeModal();render()};$('#confirm').onclick=()=>{mutate(()=>{if(c.kind==='link')c.url=$('#cardUrl').value.trim();c.title=$('#cardTitle').value.trim()||'Untitled';c.body=$('#cardBody').value;c.color=color;b.updated=Date.now()});closeModal()};$('#deleteCard').onclick=()=>{if(!confirm('Delete this card?'))return;mutate(()=>{b.cards=b.cards.filter(x=>x.id!==cid);b.connections=(b.connections||[]).filter(e=>e.from!==cid&&e.to!==cid);selection=null});closeModal()};$('#cardTitle').focus()}

let pendingProposal=null, sessionAIKey='';
function opRevision(b){return JSON.stringify({cards:b.cards,connections:b.connections||[]})}
function buildProposal(b,suggested){const v=view(),known=new Set(b.cards.map(c=>c.id));const ops=[];const tempIds=[];
 for(const entry of (suggested.cards||[]).slice(0,35)){if(!entry||typeof entry.title!=='string'||!entry.title.trim())continue;const cid=id();tempIds.push(cid);const i=tempIds.length-1;ops.push({type:'create_card',card:{id:cid,kind:'text',title:entry.title.slice(0,110),body:String(entry.body||'').slice(0,3000),color:COLORS.includes(entry.color)?entry.color:COLORS[1+(i%5)],x:Math.round((180-v.x)/v.scale+(i%3)*255),y:Math.round((140-v.y)/v.scale+Math.floor(i/3)*175)}})}
 for(const entry of (suggested.connections||[]).slice(0,40)){const all=[...b.cards.map(c=>c.id),...tempIds];const from=Number(entry.from),to=Number(entry.to);if(!Number.isInteger(from)||!Number.isInteger(to)||!all[from]||!all[to]||from===to)continue;ops.push({type:'connect_cards',from:all[from],to:all[to]})}
 return {boardId:b.id,revision:opRevision(b),operations:ops};}
function openProposal(){const b=activeBoard();if(!b)return;modal('AI board assistant',`<p class="pdfStat">Ask for new cards and connections. Suggestions are only previews until you approve them.</p><label>Request<textarea id="aiPrompt" class="field" placeholder="Suggest three ways to expand this board, then connect related ideas."></textarea></label><label>OpenAI API key (this session only)<input id="aiKey" class="field" type="password" autocomplete="off" placeholder="sk-..." value="${esc(sessionAIKey)}"></label><div class="pdfNotice">Your request and board text will be sent directly from this browser to OpenAI when you press Generate. API usage may incur charges. The key is held in this page's memory, never saved with your boards or exports. For production we'll use a secure gateway instead. You can also test approval without AI using manual card titles.</div><label>Manual proposal (one card title per line)<textarea id="proposalText" class="field" placeholder="Idea one&#10;Idea two"></textarea></label>`,'<button class="outline" id="cancel">Cancel</button><button class="outline" id="makeProposal">Preview manual</button><button class="primary" id="generateAI">Generate with AI</button>');$('#cancel').onclick=closeModal;$('#makeProposal').onclick=()=>{const lines=$('#proposalText').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,35);if(!lines.length){alert('Enter at least one card title.');return}pendingProposal=buildProposal(b,{cards:lines.map(title=>({title}))});previewProposal()};$('#generateAI').onclick=async()=>{const prompt=$('#aiPrompt').value.trim(),key=$('#aiKey').value.trim();if(!prompt||!key){alert('Enter a request and API key.');return}sessionAIKey=key;const button=$('#generateAI');button.disabled=true;button.textContent='Generating…';try{const context=b.cards.slice(0,75).map((c,i)=>({index:i,title:String(c.title||'').slice(0,130),body:String(c.body||'').slice(0,650)}));const response=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify({model:'gpt-4o-mini',response_format:{type:'json_object'},temperature:.5,messages:[{role:'system',content:'You help create editable visual mind maps. Reply ONLY as JSON with fields cards (array of objects with title, body, optional color), connections (array of objects with integer from and to). Connection indices refer to existing cards listed in order first, then new cards in output order. Propose at most 15 cards and 25 connections. Never include irrelevant content or instructions.'},{role:'user',content:JSON.stringify({request:prompt,existingCards:context})}]})});const data=await response.json();if(!response.ok)throw Error(data.error?.message||'API request failed ('+response.status+')');const result=JSON.parse(data.choices?.[0]?.message?.content||'{}');pendingProposal=buildProposal(b,result);if(!pendingProposal.operations.length)throw Error('No valid edits were proposed');previewProposal()}catch(e){alert('AI request failed: '+e.message+'\n\nIf your browser blocks direct API requests, use a hosted web version or gateway.');button.disabled=false;button.textContent='Generate with AI'}}}
function previewProposal(){const p=pendingProposal;if(!p)return;modal('Review proposed edits',`<p class="pdfStat"><strong>${p.operations.length} proposed operations</strong> · Nothing applied yet</p><div class="pdfPreview">${p.operations.map((op,i)=>`<div class="pdfPage"><label style="display:flex;gap:9px;align-items:center"><input type="checkbox" data-op="${i}" checked><span>${op.type==='create_card'?`＋ <strong>${esc(op.card.title)}</strong><div class="pdfStat">${esc(op.card.body.slice(0,260))}</div>`:'↗ Connection between two cards'}</span></label></div>`).join('')}</div><div class="pdfNotice">Approval creates one undoable change set. Reject leaves the board untouched. A connection is skipped if one of its proposed cards was not approved.</div>`,'<button class="outline" id="rejectProposal">Reject all</button><button class="primary" id="approveProposal">Approve selected</button>');$('#rejectProposal').onclick=()=>{pendingProposal=null;closeModal()};$('#approveProposal').onclick=()=>{const b=state.boards.find(x=>x.id===p.boardId);if(!b){alert('Board no longer exists');return}if(opRevision(b)!==p.revision){alert('This board changed during review. Generate a fresh proposal.');pendingProposal=null;closeModal();return}const selected=p.operations.filter((_,i)=>$('#modalRoot [data-op="'+i+'"]')?.checked);if(selected.length){mutate(()=>{const added=selected.filter(x=>x.type==='create_card').map(x=>x.card);b.cards.push(...added);const known=new Set(b.cards.map(c=>c.id));b.connections||=[];for(const x of selected.filter(x=>x.type==='connect_cards'))if(known.has(x.from)&&known.has(x.to)&&x.from!==x.to&&!b.connections.some(c=>(c.from===x.from&&c.to===x.to)||(c.from===x.to&&c.to===x.from)))b.connections.push({id:id(),from:x.from,to:x.to});b.updated=Date.now()})}pendingProposal=null;closeModal()}}

let pdfLibPromise=null;
function loadPdfJs(){if(globalThis.pdfjsLib)return Promise.resolve(globalThis.pdfjsLib);if(pdfLibPromise)return pdfLibPromise;pdfLibPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';script.onload=()=>{const p=globalThis.pdfjsLib;if(!p){reject(Error('PDF reader failed to initialize'));return}p.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(p)};script.onerror=()=>reject(Error('Cannot load PDF reader. An internet connection is needed the first time you use PDF import.'));document.head.appendChild(script)}).catch(e=>{pdfLibPromise=null;throw e});return pdfLibPromise}

// Heuristic: individual runs are merged into lines, then adjacent lines are combined into editable paragraph cards.
function groupPageText(items,pageWidth,pageHeight,pageNumber){const pieces=[];for(const item of items){const raw=String(item.str||'').trim();if(!raw||!item.transform)continue;const x=item.transform[4],y=pageHeight-item.transform[5],h=Math.max(7,Math.hypot(item.transform[2],item.transform[3])||Math.abs(item.height)||11);if(!Number.isFinite(x+y)||x< -20||y < -25)continue;pieces.push({text:raw,x,y,h,w:item.width||raw.length*h*.48})}pieces.sort((a,b)=>a.y-b.y||a.x-b.x);const lines=[];for(const p of pieces){let line=lines.find(l=>Math.abs(l.y-p.y)<Math.max(3,Math.min(8,p.h*.55))&&p.x>=l.x-15&&p.x<l.maxX+180);if(!line){line={x:p.x,y:p.y,maxX:p.x+p.w,h:p.h,parts:[]};lines.push(line)}line.parts.push(p);line.x=Math.min(line.x,p.x);line.maxX=Math.max(line.maxX,p.x+p.w);line.h=Math.max(line.h,p.h)}lines.forEach(l=>{l.parts.sort((a,b)=>a.x-b.x);l.text=l.parts.map(p=>p.text).join(' ')});lines.sort((a,b)=>a.y-b.y||a.x-b.x);const groups=[];for(const l of lines){let prev=groups.at(-1);const gap=prev?l.y-prev.lastY:Infinity;const aligned=prev&&Math.abs(prev.x-l.x)<Math.max(25,pageWidth*.045);const related=prev&&aligned&&gap>=-3&&gap<Math.max(22,l.h*2.0)&&Math.abs(prev.lastWidth-(l.maxX-l.x))<pageWidth*.55&&prev.lines.length<12;if(!related){prev={x:l.x,y:l.y,lastY:l.y,lastWidth:l.maxX-l.x,width:l.maxX-l.x,lines:[],page:pageNumber};groups.push(prev)}prev.lines.push(l.text);prev.lastY=l.y;prev.lastWidth=l.maxX-l.x;prev.width=Math.max(prev.width,l.maxX-prev.x)}return groups.map(g=>({page:g.page,x:g.x,y:g.y,width:g.width,text:g.lines.join('\n')})).filter(g=>g.text.trim().length>1)}
// PDF appearance recovery is best-effort. PDF operators describe drawing commands, not board objects.
function pdfRgbAt(ctx,x,y){try{const q=ctx.getImageData(Math.max(0,Math.min(ctx.canvas.width-1,Math.round(x))),Math.max(0,Math.min(ctx.canvas.height-1,Math.round(y))),1,1).data;return [q[0],q[1],q[2]]}catch{return [255,255,255]}}
function pdfCardColor(ctx,g,k){const x=g.x*k,y=g.y*k, w=Math.max(20,g.width*k);const samples=[[x-7,y+5],[x+5,y-10],[x+w*.5,y-9],[x+w+6,y+5]].filter(([a,b])=>a>1&&b>1&&a<ctx.canvas.width-2&&b<ctx.canvas.height-2).map(([a,b])=>pdfRgbAt(ctx,a,b));if(!samples.length)return '#ffffff';const rgb=[0,1,2].map(i=>Math.round(samples.reduce((v,c)=>v+c[i],0)/samples.length));const spread=Math.max(...rgb)-Math.min(...rgb);if(spread<12||rgb.every(v=>v>242))return '#ffffff';const options=COLORS.slice(1).map(color=>{const z=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16));return {color,dist:z.reduce((t,n,i)=>t+(n-rgb[i])**2,0)}}).sort((a,b)=>a.dist-b.dist);return options[0].dist<21000?options[0].color:'#ffffff'}
function matMul(a,b){return [a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]]}
async function pdfImageRegions(page,lib,ctx,k,pageNumber){const ops=await page.getOperatorList(),F=lib.OPS,stack=[];let m=[1,0,0,1,0,0],regions=[];for(let i=0;i<ops.fnArray.length;i++){const op=ops.fnArray[i],args=ops.argsArray[i];if(op===F.save)stack.push(m.slice());else if(op===F.restore)m=stack.pop()||[1,0,0,1,0,0];else if(op===F.transform)m=matMul(m,args);else if([F.paintImageXObject,F.paintJpegXObject,F.paintInlineImageXObject,F.paintImageXObjectRepeat].includes(op)){const pts=[[0,0],[1,0],[1,1],[0,1]].map(([x,y])=>[m[0]*x+m[2]*y+m[4],m[1]*x+m[3]*y+m[5]]),xs=pts.map(q=>q[0]),ys=pts.map(q=>page.view[3]-q[1]);let x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;if(w<36||h<30||w*h<1900||x<0||y<0||regions.length>=14)continue;const sx=Math.floor(x*k),sy=Math.floor(y*k),sw=Math.min(ctx.canvas.width-sx,Math.ceil(w*k)),sh=Math.min(ctx.canvas.height-sy,Math.ceil(h*k));if(sw<=4||sh<=4)continue;const crop=document.createElement('canvas');const factor=Math.min(1,420/sw,330/sh);crop.width=Math.max(1,Math.round(sw*factor));crop.height=Math.max(1,Math.round(sh*factor));crop.getContext('2d').drawImage(ctx.canvas,sx,sy,sw,sh,0,0,crop.width,crop.height);regions.push({kind:'image',page:pageNumber,x:Math.round(x*1.35),y:Math.round(y*1.35),width:Math.min(420,Math.max(160,Math.round(w*1.35))),title:`Image · page ${pageNumber}`,body:'',color:'#ffffff',imageData:crop.toDataURL('image/jpeg',.78)})}}return regions}
let currentPdfJob=null;
function parsePageRange(text,total){if(!text.trim())return Array.from({length:total},(_,i)=>i+1);const pages=new Set();for(const token of text.split(',')){const part=token.trim();const m=part.match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('Use page ranges such as 1-10, 13, 20-25.');const first=Number(m[1]),last=m[2]?Number(m[2]):first;if(first<1||last>total||first>last)throw Error(`Page selection must be between 1 and ${total}.`);for(let p=first;p<=last;p++)pages.add(p)}return [...pages].sort((a,b)=>a-b)}
async function scanPDF(file){let lib,doc;try{lib=await loadPdfJs();doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise}catch(e){modal('PDF unavailable',`<p>${esc(e.message||e)}</p>`,'<button class="primary" id="cancel">Close</button>');$('#cancel').onclick=closeModal;return}
modal('Import PDF',`<p class="pdfStat"><strong>${esc(file.name)}</strong> · ${doc.numPages} pages</p><label>Pages to import (blank = all)<input id="pdfPages" class="field" placeholder="e.g. 1-20, 25" inputmode="text"></label><label>Batch size<select id="pdfBatch" class="field"><option value="5">5 pages</option><option value="10" selected>10 pages</option><option value="20">20 pages</option></select></label><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" id="pdfImages" checked>Recover image regions and note colors (slower)</label><div class="pdfNotice">No fixed page cap. Large PDFs may still hit browser memory or local storage limits. Work is analyzed on your device; review before importing.</div>`,'<button class="outline" id="cancel">Cancel</button><button class="primary" id="beginPdf">Analyze pages</button>');$('#cancel').onclick=()=>{closeModal();doc.destroy()};$('#beginPdf').onclick=async()=>{let pages;try{pages=parsePageRange($('#pdfPages').value,doc.numPages)}catch(e){alert(e.message);return}const batch=Number($('#pdfBatch').value),appearance=$('#pdfImages').checked;const job={cancelled:false};currentPdfJob=job;const groups=[],images=[];let yOffset=0;modal('Analyzing PDF',`<div class="pdfStat" id="pdfProgress">Starting…</div><progress id="pdfBar" max="${pages.length}" value="0" style="width:100%;height:17px"></progress><div class="pdfNotice">You can cancel between pages. No board changes are applied until you approve the preview.</div>`,'<button class="outline" id="cancelPdf">Cancel analysis</button>');$('#cancelPdf').onclick=()=>{job.cancelled=true;$('#cancelPdf').disabled=true;$('#cancelPdf').textContent='Cancelling…'};
try{for(let i=0;i<pages.length;i++){if(job.cancelled)break;const p=pages[i];const label=$('#pdfProgress');if(label)label.textContent=`Page ${p} · ${i+1} of ${pages.length} selected`;await new Promise(requestAnimationFrame);const page=await doc.getPage(p);try{const vp=page.getViewport({scale:1}),tc=await page.getTextContent(),pg=groupPageText(tc.items,vp.width,vp.height,p);let ctx=null,k=1.2;if(appearance){const canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width*k);canvas.height=Math.ceil(vp.height*k);ctx=canvas.getContext('2d',{willReadFrequently:true});await page.render({canvasContext:ctx,viewport:page.getViewport({scale:k})}).promise}pg.forEach(g=>groups.push({...g,x:Math.round(g.x*1.35),y:Math.round(g.y*1.35+yOffset),width:Math.round(g.width*1.35),color:ctx?pdfCardColor(ctx,g,k):'#ffffff'}));if(ctx){try{const found=await pdfImageRegions(page,lib,ctx,k,p);found.forEach(g=>images.push({...g,y:g.y+yOffset}))}catch(e){console.warn('Image recovery skipped:',e)}ctx.canvas.width=0;ctx.canvas.height=0}yOffset+=vp.height*1.35+110}finally{page.cleanup()}const bar=$('#pdfBar');if(bar)bar.value=i+1;if((i+1)%batch===0)await new Promise(r=>setTimeout(r,0))}if(!groups.length&&!images.length){closeModal();alert(job.cancelled?'Analysis cancelled; no content found in completed pages.':'No selectable text or identifiable image regions found. Scanned PDFs may require OCR.');return}pdfImportPreview(file,groups,images,doc.numPages,job.cancelled?'cancelled after '+(groups.length+images.length)+' items':pages.length);if(job.cancelled){const n=$('#modalRoot .pdfNotice');if(n)n.textContent='Analysis was cancelled. The preview contains only pages already processed. You can import these results or discard them.'}}catch(e){modal('PDF analysis interrupted',`<p>${esc(e.message||e)}</p><div class="pdfNotice">Try smaller page ranges or disable image recovery to reduce memory usage.</div>`,'<button class="primary" id="cancel">Close</button>');$('#cancel').onclick=closeModal}finally{currentPdfJob=null;await doc.destroy().catch(()=>{})}}}

function pdfImportPreview(file,groups,images,total,read){let title=file.name.replace(/\.pdf$/i,'');modal('Preview reconstructed board',`<label>Board name<input id="pdfBoardName" class="field" value="${esc(title)}" maxlength="120"></label><div class="pdfStat"><strong>${groups.length} editable text cards</strong> and <strong>${images.length} movable image cards</strong> identified across ${read} (document: ${total} pages).</div><div class="pdfNotice">Best-effort appearance recovery: text remains editable; images are movable raster crops. Note boundaries, exact connections, and every original color cannot be guaranteed. Imported images are saved with the workspace in IndexedDB when your browser supports it; very large imports can still exhaust device storage.</div><div class="pdfPreview">${groups.slice(0,12).map(g=>`<div class="pdfPage" style="border-left:6px solid ${g.color}"><strong>Page ${g.page}</strong><div class="pdfSample">${esc(g.text.slice(0,220))}${g.text.length>220?'…':''}</div></div>`).join('')}${images.slice(0,5).map(g=>`<div class="pdfPage"><strong>Image from page ${g.page}</strong><img src="${g.imageData}" style="max-height:110px;max-width:100%;display:block;margin-top:8px"></div>`).join('')}${groups.length>12||images.length>5?`<div class="pdfStat">More items will be included in the import.</div>`:''}</div>`,'<button class="outline" id="cancel">Cancel</button><button class="primary" id="confirmPdf">Import board</button>');$('#cancel').onclick=closeModal;$('#confirmPdf').onclick=()=>{const name=$('#pdfBoardName').value.trim()||title||'Imported PDF';const board={id:id(),title:name,updated:Date.now(),connections:[],cards:[...groups.map((g,i)=>({id:id(),kind:'text',title:`Page ${g.page} · ${i+1}`,body:g.text,color:g.color,x:g.x+30,y:g.y+30,width:Math.min(420,Math.max(160,g.width+25)),source:{file:file.name,page:g.page,type:'pdf-text'}})),...images.map(g=>({...g,id:id(),x:g.x+30,y:g.y+30,source:{file:file.name,page:g.page,type:'pdf-image'}}))]};try{mutate(()=>state.boards.push(board));closeModal();menu=false;ensureTab(board.id);center();alert(`Imported ${board.cards.length} cards. Export a JSON backup to preserve your work.`)}catch(e){alert('Unable to save this import, likely due to browser storage limits. Try a smaller PDF or fewer images. '+e.message)}}}

function download(obj,name,type='application/json'){const url=URL.createObjectURL(new Blob([obj],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportBackup(){download(JSON.stringify({format:'openboard-v1',boards:state.boards,views:state.views},null,2),'openboard-backup.json')}
$('#home').onclick=showLibrary;$('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify(state));state=JSON.parse(history.pop());save();render()};$('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify(state));state=JSON.parse(future.pop());save();render()};$('#export').onclick=exportBackup;
document.addEventListener('click',e=>{const boardMenu=e.target.closest('[data-boardmenu]');if(boardMenu){e.preventDefault();e.stopPropagation();boardOptions(boardMenu.dataset.boardmenu);return}const board=e.target.closest('[data-board]');if(board){ensureTab(board.dataset.board);return}if(e.target.closest('#newBoard'))createBoard();if(e.target.closest('#pdfImport')||e.target.closest('#addPDF')){menu=false;openPdfPicker()};if(e.target.closest('#import')){const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{try{const data=JSON.parse(await inp.files[0].text());if(!Array.isArray(data.boards))throw Error('Not an Openboard backup');mutate(()=>{const used=new Set(state.boards.map(b=>b.id));data.boards.forEach(b=>{if(!Array.isArray(b.cards))return;const newid=used.has(b.id)?id():b.id;used.add(newid);state.boards.push({id:newid,title:String(b.title||'Imported board'),cards:b.cards.map(c=>({...c,id:id(),title:String(c.title||''),body:String(c.body||''),x:Number(c.x)||0,y:Number(c.y)||0,color:COLORS.includes(c.color)?c.color:'#fff'})),connections:[],updated:Date.now()})})});alert('Boards imported successfully.')}catch(err){alert('Could not import: '+err.message)}};inp.click()}
if(e.target.closest('[data-close]')){e.stopPropagation();const t=e.target.closest('[data-close]').dataset.close;state.tabs=state.tabs.filter(x=>x!==t);if(state.active===t)state.active=state.tabs.at(-1)||null;save();if(!state.active)showLibrary();else render();return}const tab=e.target.closest('[data-tab]');if(tab){state.active=tab.dataset.tab;selection=null;save();render();return}if(e.target.closest('#pickBoard'))chooseBoard();if(e.target.closest('#add')){menu=!menu;render()}if(e.target.closest('#addText'))addCard();if(e.target.closest('#addTask'))addCard('task');if(e.target.closest('#addLink'))addCard('link');if(e.target.closest('#addNested'))addCard('nested');if(e.target.closest('#autoLayout'))autoLayout();const nested=e.target.closest('[data-open-nested]');if(nested){e.stopPropagation();if(state.boards.some(b=>b.id===nested.dataset.openNested))ensureTab(nested.dataset.openNested);return;}if(e.target.closest('#zoomIn')){const r=$('#canvas').getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)}if(e.target.closest('#zoomOut')){const r=$('#canvas').getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)}if(e.target.closest('#center'))center();if(e.target.closest('#editBoard'))boardOptions(state.active);if(e.target.closest('[data-cardmenu]')){e.stopPropagation();editCard(e.target.closest('[data-cardmenu]').dataset.cardmenu)}});
const pts=new Map();let gesture=null,holdTimer=null,lastTap={t:0,id:null};function clearHold(){clearTimeout(holdTimer);holdTimer=null}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
document.addEventListener('pointerdown',e=>{const canvas=e.target.closest('#canvas');if(!canvas||e.target.closest('button,.floatMenu'))return;const card=e.target.closest('[data-card]');canvas.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY});if(pts.size===2){clearHold();const p=[...pts.values()];gesture={kind:'pinch',dist:dist(p[0],p[1]),scale:view().scale,x:view().x,y:view().y,mid:{x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2},rect:canvas.getBoundingClientRect()};return}if(card){if(connectFrom){connectCards(connectFrom,card.dataset.card);return}selection=card.dataset.card;drawCards();gesture={kind:'cardPending',id:selection,startX:e.clientX,startY:e.clientY,cardX:activeBoard().cards.find(c=>c.id===selection).x,cardY:activeBoard().cards.find(c=>c.id===selection).y};holdTimer=setTimeout(()=>{if(gesture?.kind==='cardPending'){snapshot();gesture.kind='cardDrag';canvas.classList.add('dragging')}},230)}else{selection=null;drawCards();gesture={kind:'pan',startX:e.clientX,startY:e.clientY,x:view().x,y:view().y};canvas.classList.add('dragging')}},{passive:false});
document.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);p.x=e.clientX;p.y=e.clientY;const canvas=$('#canvas');if(!canvas)return;if(pts.size===2){if(gesture?.kind!=='pinch')return;const pair=[...pts.values()];const d=dist(pair[0],pair[1]);const centerX=(pair[0].x+pair[1].x)/2-gesture.rect.left,centerY=(pair[0].y+pair[1].y)/2-gesture.rect.top;const scale=clamp(gesture.scale*d/gesture.dist,.25,3);const prevX=gesture.mid.x-gesture.rect.left,prevY=gesture.mid.y-gesture.rect.top;const v=view();v.scale=scale;v.x=centerX-(prevX-gesture.x)*scale/gesture.scale;v.y=centerY-(prevY-gesture.y)*scale/gesture.scale;updateTransform();return}if(!gesture)return;const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(gesture.kind==='cardPending'&&Math.hypot(dx,dy)>10){clearHold();gesture.kind='pan';gesture.x=view().x;gesture.y=view().y;gesture.startX=e.clientX;gesture.startY=e.clientY}if(gesture.kind==='cardDrag'){const c=activeBoard().cards.find(c=>c.id===gesture.id);if(c){c.x=Math.round(gesture.cardX+dx/view().scale);c.y=Math.round(gesture.cardY+dy/view().scale);const el=document.querySelector(`[data-card="${CSS.escape(c.id)}"]`);if(el){el.style.left=c.x+'px';el.style.top=c.y+'px'}drawWires()}}else if(gesture.kind==='pan'){view().x=gesture.x+(e.clientX-gesture.startX);view().y=gesture.y+(e.clientY-gesture.startY);updateTransform()}},{passive:false});
function endPointer(e){if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);clearHold();if(pts.size){if(gesture?.kind==='pinch'&&pts.size===1){const p=[...pts.values()][0];gesture={kind:'pan',startX:p.x,startY:p.y,x:view().x,y:view().y}}return}const g=gesture;gesture=null;const canvas=$('#canvas');canvas?.classList.remove('dragging');if(g?.kind==='cardDrag'){activeBoard().updated=Date.now();future=[];save()}else if(g?.kind==='cardPending'){const now=Date.now();if(lastTap.id===g.id&&now-lastTap.t<350){lastTap={t:0,id:null};editCard(g.id)}else lastTap={t:now,id:g.id}}else save()}
document.addEventListener('pointerup',endPointer);document.addEventListener('pointercancel',endPointer);document.addEventListener('wheel',e=>{const c=e.target.closest('#canvas');if(!c)return;e.preventDefault();const r=c.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.001),e.clientX-r.left,e.clientY-r.top)},{passive:false});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea')){e.preventDefault();$('#undo').click()}if(e.key==='Escape'){connectFrom=null;closeModal();render()}});
render();initDatabase();})();
</script></body></html>
